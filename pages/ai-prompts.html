<!DOCTYPE html>
<html lang="en">

<head>
    <script>if (localStorage.getItem('theme') !== 'dark') document.documentElement.classList.add('light-mode');</script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompts | Lê Xuân Sinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        .prompt-card {
            background: var(--color-glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-glass-border);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
        }

        .prompt-card:hover {
            border-color: var(--color-primary);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1);
            transform: translateY(-5px);
        }

        .prompt-tag {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(139, 92, 246, 0.1);
            color: var(--color-primary);
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }

        .prompt-code-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1rem;
            position: relative;
            margin-top: auto;
        }

        .light-mode .prompt-code-box {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .prompt-code {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--color-text);
            opacity: 0.9;
            word-break: break-word;
            margin: 0;
            white-space: pre-wrap;
        }

        .copy-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            margin-top: 1rem;
            font-weight: 500;
            width: 100%;
            justify-content: center;
        }

        .copy-btn:hover {
            background: var(--color-accent);
            transform: scale(1.02);
        }

        .copy-btn.copied {
            background: #4ade80;
        }

        /* Pagination Styles */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }

        .page-btn {
            background: var(--color-glass-bg);
            border: 1px solid var(--color-glass-border);
            color: var(--color-text);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .page-btn.active {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="pt-navbar container">
        <section class="fade-up" style="margin-bottom: 3rem;">
            <h1 style="font-size: clamp(3rem, 5vw, 4rem); margin-bottom: 1rem;" data-i18n="prompts.title">Thư Viện AI
                Prompts</h1>
            <p class="text-lead" data-i18n="prompts.desc" style="max-width: 700px;">Tuyển tập các câu lệnh (prompts)
                chuyên sâu dành cho việc tạo video Veo 3, ra lệnh cho ChatGPT, Gemini và nhiều công cụ AI khác. Copy và
                sử dụng ngay!</p>
        </section>

        <section class="section-padding fade-up">
            <div class="filter-tabs" id="prompt-filters"
                style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;">
                <button class="filter-btn active" data-filter="all">Tất Cả</button>
                <button class="filter-btn" data-filter="video">Video (Veo/Sora)</button>
                <button class="filter-btn" data-filter="chat">Chatbot (GPT/Gemini)</button>
                <button class="filter-btn" data-filter="image">Hình Ảnh (Midjourney)</button>
                <button class="filter-btn" data-filter="code">Lập Trình (Code)</button>
                <button class="filter-btn" data-filter="marketing">Marketing (SEO/Ads)</button>
                <button class="filter-btn" data-filter="productivity">Năng Suất (Office)</button>
            </div>

            <div class="grid-2" id="prompts-grid" style="margin-top: 2rem;">
                <!-- Dynamically rendered prompts will go here -->
            </div>

            <!-- Pagination Container -->
            <div class="pagination" id="prompt-pagination">
                <!-- Dynamically rendered pagination -->
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/data/prompts.js"></script>
    <script src="/data/site.js"></script>
    <script src="/data/translations/vi.js"></script>
    <script src="/data/translations/en.js"></script>
    <script src="/scripts/utils.js"></script>
    <script src="/scripts/i18n.js"></script>
    <script src="/scripts/components.js"></script>
    <script src="/scripts/main.js"></script>
    <script src="/scripts/page-init.js"></script>

    <script>
        const allPrompts = window.AllPrompts || [];

        let currentPage = 1;
        const itemsPerPage = 8;
        let currentFilter = 'all';

        function renderPrompts() {
            const grid = document.getElementById('prompts-grid');
            grid.innerHTML = ''; // Clear current

            const filtered = allPrompts.filter(p => currentFilter === 'all' || p.category === currentFilter);

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filtered.slice(startIndex, endIndex);

            paginatedItems.forEach((p, index) => {
                const staggerClass = index % 2 !== 0 ? 'stagger-1' : '';
                let btnText = "Sao Chép Prompt";
                if (window.I18n && window.locales && window.I18n.getNestedValue) {
                    const dict = window.locales[window.I18n.currentLang || 'vi'];
                    if (dict) btnText = window.I18n.getNestedValue(dict, 'prompts.copy_btn') || btnText;
                }

                const cardHtml = `
                    <article class="prompt-card prompt-item fade-up ${staggerClass}">
                        <span class="prompt-tag" style="${p.tagStyle}"><i class="ph-fill ${p.tagIcon}"></i> ${p.tagText}</span>
                        <h3 style="margin: 0; font-size: 1.4rem;">${p.title}</h3>
                        <p class="text-lead" style="font-size: 1rem; margin: 0;">${p.desc}</p>
                        <div class="prompt-code-box">
                            <p class="prompt-code">${p.prompt}</p>
                        </div>
                        <button class="copy-btn" onclick="copyPrompt(this)"><i class="ph ph-copy"></i> <span>${btnText}</span></button>
                    </article>
                `;
                grid.innerHTML += cardHtml;
            });

            // Trigger scroll reveal for new items
            setTimeout(() => {
                if (window.Utils && window.Utils.initScrollReveal) {
                    window.Utils.initScrollReveal();
                } else {
                    document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
                }
            }, 50);

            renderPagination(filtered.length);
        }

        function renderPagination(totalItems) {
            const paginationContainer = document.getElementById('prompt-pagination');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return;

            const createBtn = (text, page, isDisabled = false, isActive = false) => {
                const btn = document.createElement('button');
                btn.className = `page-btn ${isActive ? 'active' : ''}`;
                btn.innerHTML = text;
                btn.disabled = isDisabled;

                if (!isDisabled && !isActive && page !== '...') {
                    btn.onclick = () => {
                        currentPage = page;
                        renderPrompts();
                        window.scrollTo({ top: document.getElementById('prompt-filters').offsetTop - 100, behavior: 'smooth' });
                    };
                }

                if (page === '...') {
                    btn.style.cursor = 'default';
                    btn.style.borderColor = 'transparent';
                    btn.style.background = 'transparent';
                    btn.style.fontWeight = 'bold';
                    btn.style.pointerEvents = 'none';
                }

                return btn;
            };

            // Prev Button
            paginationContainer.appendChild(createBtn('<i class="ph ph-caret-left"></i>', currentPage - 1, currentPage === 1));

            // Logic to show pages 1 2 3 ... 6 7 or similar
            let startPage = Math.max(1, currentPage - 1);
            let endPage = Math.min(totalPages, currentPage + 1);

            if (currentPage <= 2) {
                endPage = Math.min(totalPages, 3);
            }
            if (currentPage >= totalPages - 1) {
                startPage = Math.max(1, totalPages - 2);
            }

            if (startPage > 1) {
                paginationContainer.appendChild(createBtn(1, 1));
                if (startPage > 2) {
                    paginationContainer.appendChild(createBtn('...', '...', true));
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationContainer.appendChild(createBtn(i, i, false, currentPage === i));
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationContainer.appendChild(createBtn('...', '...', true));
                }
                paginationContainer.appendChild(createBtn(totalPages, totalPages));
            }

            // Next Button
            paginationContainer.appendChild(createBtn('<i class="ph ph-caret-right"></i>', currentPage + 1, currentPage === totalPages));
        }

        document.addEventListener('AppReady', () => {
            // Initial Render
            renderPrompts();

            // Filtering
            const filterBtns = document.querySelectorAll('#prompt-filters .filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentFilter = btn.getAttribute('data-filter');
                    currentPage = 1; // Reset to page 1 on filter
                    renderPrompts();
                });
            });
        });

        // Copy functionality
        window.copyPrompt = function (btn) {
            const card = btn.closest('.prompt-card');
            const codeText = card.querySelector('.prompt-code').innerText;

            navigator.clipboard.writeText(codeText).then(() => {
                const originalHtml = btn.innerHTML;
                let copiedText = "Đã sao chép!";
                if (window.I18n && window.locales && window.I18n.getNestedValue) {
                    const dict = window.locales[window.I18n.currentLang || 'vi'];
                    if (dict) copiedText = window.I18n.getNestedValue(dict, 'prompts.copied') || copiedText;
                }

                btn.innerHTML = `<i class="ph-fill ph-check-circle"></i> <span>${copiedText}</span>`;
                btn.classList.add('copied');

                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove('copied');
                }, 2000);
            });
        };
    </script>
</body>

</html>
